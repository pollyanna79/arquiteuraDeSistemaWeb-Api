<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="rodando.css">
    
    
    <title>Rodando o Banco</title>
</head>
<body>
    <div class="container">
        <h1>Enviando dados ao banco</h1>
        <form>
       <input type="text" name="nome" size="20" placeholder="Digite seu nome">
       <br>
        <input type="number" name="telefone" size="20" placeholder="Digite seu telefone">
       <br>
          <input type="number" name="cep" size="20" placeholder="Digite seu cep">
       <br>
        <input type="text" name="endereco" size="20" placeholder="Digite seu Endereço">
       <br>
        <input type="number" name="cpf" size="20" placeholder="Digite seu cpf">
       <br>
         <input type="email" name="email" size="20" placeholder="Digite seu email">
        <br>
        <input type="password" name="senha" maxlength="10" placeholder="Digite sua senha">
        <br>
    
        <button type="submit">Enviar ao banco de dados </button>
        </form>
        <div class="response">
            <h2>Consulta de Clientes:</h2>
            
            <button type="button"id="btnBuscar">Buscar dados do banco de dados</button>
<div id="listaClientes"></div>
        </div>
    </div>
    <script src="clientes.js"></script>

</body>
</html>
